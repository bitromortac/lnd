type: google.api.Service
config_version: 3

http:
  rules:
    - selector: devrpc.Dev.ImportGraph
      post: "/v2/dev/importgraph"
      body: "*"
    - selector: devrpc.Dev.Quiesce
      post: "/v2/dev/quiesce"
      body: "*"
    - selector: devrpc.Dev.CreateOffer
      post: "/v2/dev/createoffer"
      body: "*"
    - selector: devrpc.Dev.DecodeOffer
      get: "/v2/dev/decodeoffer/{offer}"
    - selector: devrpc.Dev.RequestInvoice
      post: "/v2/dev/requestinvoice"
      body: "*"
    - selector: devrpc.Dev.PayOffer
      post: "/v2/dev/payoffer"
      body: "*"
