syntax = "proto3";

package devrpc;

import "lightning.proto";

option go_package = "github.com/lightningnetwork/lnd/lnrpc/devrpc";

/*
 * Comments in this file will be directly parsed into the API
 * Documentation as descriptions of the associated method, message, or field.
 * These descriptions should go right above the definition of the object, and
 * can be in either block or // comment format.
 *
 * An RPC method can be matched to an lncli command by placing a line in the
 * beginning of the description in exactly the following format:
 * lncli: `methodname`
 *
 * Failure to specify the exact name of the command will cause documentation
 * generation to fail.
 *
 * More information on how exactly the gRPC documentation is generated from
 * this proto file can be found here:
 * https://github.com/lightninglabs/lightning-api
 */

service Dev {
    /* lncli: `importgraph`
    ImportGraph imports a ChannelGraph into the graph database. Should only be
    used for development.
    */
    rpc ImportGraph (lnrpc.ChannelGraph) returns (ImportGraphResponse);

    /*
    Quiesce instructs a channel to initiate the quiescence (stfu) protocol. This
    RPC is for testing purposes only. The commit that adds it will be removed
    once interop is confirmed.
    */
    rpc Quiesce (QuiescenceRequest) returns (QuiescenceResponse);

    /* lncli: `createoffer`
    CreateOffer creates a new BOLT 12 offer. The offer is persisted in the
    offer store and the encoded offer string (lno1...) is returned. The node
    must run with --protocol.bolt12-offers.
    */
    rpc CreateOffer (CreateOfferRequest) returns (CreateOfferResponse);

    /* lncli: `decodeoffer`
    DecodeOffer takes a bech32-encoded BOLT 12 offer string (lno1...) and
    returns the decoded fields. This is a stateless utility analogous to
    DecodePayReq for BOLT 11. The node must run with
    --protocol.bolt12-offers.
    */
    rpc DecodeOffer (DecodeOfferRequest) returns (DecodeOfferResponse);

    /* lncli: `requestinvoice`
    RequestInvoice takes a BOLT 12 offer string, constructs and signs an
    invoice request, sends it to the offer's issuer via onion message,
    waits for the invoice reply, validates it, and returns the decoded
    BOLT 12 invoice. No payment is dispatched. The node must run with
    --protocol.bolt12-offers.
    */
    rpc RequestInvoice (RequestInvoiceRequest) returns (RequestInvoiceResponse);

    /* lncli: `payoffer`
    PayOffer takes a BOLT 12 offer string, negotiates an invoice with the
    offer's issuer via onion message, validates the returned invoice, and
    dispatches an HTLC to complete the payment. Returns a stream of updates:
    invoice_request_sent, invoice_received, and payment_result. The node
    must run with --protocol.bolt12-offers.
    */
    rpc PayOffer (PayOfferRequest) returns (stream PayOfferUpdate);

    /* lncli: `createinvoicerequest`
    CreateInvoiceRequest publishes an invoice request without an offer as an
    lnr1 string: an offer to send money, for a refund or a withdrawal. The
    payee answers it with an invoice, and the node pays that invoice at most
    once. An invoice from expected_node_id is paid at once. Without an
    expected node, the invoice waits for ApproveInvoiceRequestPayment. The
    node must run with --protocol.bolt12-offers.
    */
    rpc CreateInvoiceRequest (CreateInvoiceRequestRequest)
        returns (CreateInvoiceRequestResponse);

    /* lncli: `sendinvoice`
    SendInvoice answers an invoice request without an offer (lnr1...) with a
    BOLT 12 invoice. The node stores the invoice, sends it to the payer by
    onion message and returns it. The payer then pays it. The node must run
    with --protocol.bolt12-offers.
    */
    rpc SendInvoice (SendInvoiceRequest) returns (SendInvoiceResponse);

    /* lncli: `listinvoicerequests`
    ListInvoiceRequests returns the invoice requests without an offer that
    this node published, with the invoices that wait for approval. The node
    must run with --protocol.bolt12-offers.
    */
    rpc ListInvoiceRequests (ListInvoiceRequestsRequest)
        returns (ListInvoiceRequestsResponse);

    /* lncli: `approveinvoicerequestpayment`
    ApproveInvoiceRequestPayment pays an invoice that answers one of this
    node's published invoice requests and waits for approval, because the
    request names no expected node. It returns when the payment settles. The
    node must run with --protocol.bolt12-offers.
    */
    rpc ApproveInvoiceRequestPayment (ApproveInvoiceRequestPaymentRequest)
        returns (ApproveInvoiceRequestPaymentResponse);
}

message ImportGraphResponse {
}

message QuiescenceRequest {
    // The channel point of the channel we wish to quiesce
    lnrpc.ChannelPoint chan_id = 1;
}

message QuiescenceResponse {
    // Indicates whether or not we hold the initiator role or not once the
    // negotiation completes
    bool initiator = 1;
}

message CreateOfferRequest {
    // A UTF-8 description of the purpose of the payment. Required when
    // amount_msat is set.
    string description = 1;

    // The amount expected per item in millisatoshis. Zero or unset means
    // the payer chooses the amount.
    uint64 amount_msat = 2;

    // Seconds since epoch after which the offer expires. Zero or unset
    // means no expiry.
    uint64 absolute_expiry = 3;

    // Maximum number of items that can be requested in a single invoice.
    // Zero means unlimited. If not set, quantity selection is not
    // supported.
    optional uint64 quantity_max = 4;

    // When true, the offer uses blinded message paths (offer_paths) instead
    // of revealing the node's identity via offer_issuer_id. This provides
    // receiver privacy. The payer cannot learn the receiver's node pubkey
    // from the offer.
    bool use_blinded_paths = 5;
}

message CreateOfferResponse {
    // The bech32-encoded offer string (lno1...).
    string offer = 1;

    // The 32-byte offer hash: the SHA256 of the offer's TLV records.
    bytes offer_hash = 2;
}

message DecodeOfferRequest {
    // The bech32-encoded offer string (lno1...).
    string offer = 1;
}

message DecodeOfferResponse {
    // The 32-byte offer hash: the SHA256 of the offer's TLV records.
    bytes offer_hash = 1;

    // The UTF-8 description of the purpose of the payment.
    string description = 2;

    // The amount per item in millisatoshis. Zero if the payer chooses.
    uint64 amount_msat = 3;

    // Whether the offer specifies a fixed amount.
    bool has_amount = 4;

    // The offer issuer's free-form name or identifier.
    string issuer = 5;

    // Seconds since epoch after which the offer expires. Zero if no
    // expiry.
    uint64 absolute_expiry = 6;

    // Whether the offer has an expiry.
    bool has_expiry = 7;

    // Maximum number of items per invoice. Zero means unlimited.
    uint64 quantity_max = 8;

    // Whether the offer supports quantity selection.
    bool has_quantity_max = 9;

    // The 33-byte compressed pubkey of the offer issuer. Empty when
    // offer_paths is used instead.
    bytes offer_issuer_id = 10;

    // Blinded paths for reaching the offer issuer when
    // offer_issuer_id is absent.
    repeated lnrpc.BlindedPath offer_paths = 11;

    // The raw feature bits advertised by the offer.
    bytes features = 12;

    // The chains this offer is valid for, as hex-encoded 32-byte
    // chain hashes. Empty implies bitcoin only.
    repeated string chains = 13;

    // The currency for offer_amount (e.g. "USD"). Empty means the
    // amount is denominated in the chain's native unit (msat for
    // bitcoin).
    string currency = 14;
}

message RequestInvoiceRequest {
    // The bech32-encoded offer string (lno1...).
    string offer = 1;

    // The amount in millisatoshis. Required when the offer does not
    // specify a fixed amount.
    uint64 amount_msat = 2;

    // The number of items to request. Required when the offer
    // supports quantity selection.
    uint64 quantity = 3;

    // An optional payer note included in the invoice request.
    string payer_note = 4;

    // Timeout in seconds to wait for the invoice reply. Defaults to
    // 30 if unset or zero.
    uint64 timeout_seconds = 5;
}

message RequestInvoiceResponse {
    // The bech32-encoded BOLT 12 invoice string (lni1...).
    string invoice_string = 1;

    // The 33-byte compressed pubkey that signed the invoice.
    bytes invoice_node_id = 2;

    // The invoice amount in millisatoshis.
    uint64 invoice_amount_msat = 3;

    // The 32-byte payment hash for the invoice.
    bytes invoice_payment_hash = 4;

    // The 33-byte compressed ephemeral payer pubkey from the
    // invoice request.
    bytes invreq_payer_id = 5;

    // The decoded offer fields from the invoice for convenience.
    DecodeOfferResponse offer = 6;
}

message PayOfferRequest {
    // The bech32-encoded offer string (lno1...).
    string offer = 1;

    // The amount in millisatoshis. Required when the offer does not
    // specify a fixed amount.
    uint64 amount_msat = 2;

    // The number of items to request. Required when the offer
    // supports quantity selection.
    uint64 quantity = 3;

    // An optional payer note included in the invoice request.
    string payer_note = 4;

    // Timeout in seconds to wait for the invoice reply during
    // negotiation. Defaults to 60 if unset or zero.
    uint64 timeout_seconds = 5;

    // Maximum fee in millisatoshis to pay for routing. If zero, a
    // default percentage of the payment amount is used.
    int64 fee_limit_msat = 6;

    // The caller's idempotency key for this payment. A call with a key
    // that already has a payment returns that payment instead of paying
    // again, and a key used with other parameters is refused. If empty,
    // the node generates a random key and reports it in the updates.
    bytes idempotency_key = 7;
}

message PayOfferUpdate {
    oneof update {
        PayOfferInvoiceRequestSent invoice_request_sent = 1;
        PayOfferInvoiceReceived invoice_received = 2;
        PayOfferPaymentResult payment_result = 3;
    }
}

message PayOfferInvoiceRequestSent {
    // The decoded offer fields.
    DecodeOfferResponse offer = 1;

    // The amount being requested in millisatoshis.
    uint64 amount_msat = 2;

    // The 33-byte compressed ephemeral payer pubkey.
    bytes invreq_payer_id = 3;

    // The idempotency key of this payment. A retry with the same key
    // returns this payment instead of paying again.
    bytes idempotency_key = 4;
}

message PayOfferInvoiceReceived {
    // The bech32-encoded BOLT 12 invoice string (lni1...).
    string invoice_string = 1;

    // The invoice amount in millisatoshis.
    uint64 invoice_amount_msat = 2;

    // The 32-byte payment hash from the invoice.
    bytes invoice_payment_hash = 3;

    // The decoded offer fields.
    DecodeOfferResponse offer = 4;
}

message PayOfferPaymentResult {
    // The 32-byte payment preimage proving settlement.
    bytes payment_preimage = 1;

    // The 32-byte payment hash.
    bytes payment_hash = 2;

    // The settled amount in millisatoshis.
    uint64 amount_msat = 3;

    // The bech32-encoded BOLT 12 invoice string (lni1...).
    string invoice_string = 4;

    // The 33-byte compressed ephemeral payer pubkey from the
    // invoice request.
    bytes invreq_payer_id = 5;

    // The decoded offer fields from the invoice for convenience.
    DecodeOfferResponse offer = 6;

    // The idempotency key of this payment.
    bytes idempotency_key = 7;
}

message CreateInvoiceRequestRequest {
    // The purpose of the payment, set as offer_description.
    string description = 1;

    // The amount this node pays, in millisatoshis.
    uint64 amount_msat = 2;

    // If set, the time in seconds since the epoch after which the node no
    // longer pays an invoice for the request.
    uint64 absolute_expiry = 3;

    // The 33-byte invoice_node_id agreed with the payee out of band. An
    // invoice from this node is paid at once. If empty, every invoice waits
    // for ApproveInvoiceRequestPayment.
    bytes expected_node_id = 4;

    // The caller's idempotency key. A call with a known key returns the
    // stored request. If empty, the node generates a random key.
    bytes idempotency_key = 5;

    // The maximum routing fee in millisatoshis for paying an invoice from
    // the expected node at once. If zero, the default fee limit applies.
    int64 fee_limit_msat = 6;
}

message CreateInvoiceRequestResponse {
    // The signed invoice request (lnr1...).
    string invoice_request = 1;

    // The idempotency key of the request.
    bytes idempotency_key = 2;
}

message SendInvoiceRequest {
    // The invoice request without an offer (lnr1...) to answer.
    string invoice_request = 1;
}

message SendInvoiceResponse {
    // The signed invoice that was sent (lni1...).
    string invoice = 1;

    // The 32-byte payment hash of the invoice.
    bytes payment_hash = 2;

    // The invoice amount in millisatoshis.
    uint64 amount_msat = 3;
}

message ListInvoiceRequestsRequest {
}

message PendingInvoice {
    // The invoice that waits for approval (lni1...).
    string invoice = 1;

    // The 32-byte payment hash of the invoice.
    bytes payment_hash = 2;

    // The 33-byte invoice_node_id that signed the invoice.
    bytes invoice_node_id = 3;
}

message PublishedInvoiceRequest {
    // The signed invoice request (lnr1...).
    string invoice_request = 1;

    // The idempotency key of the request.
    bytes idempotency_key = 2;

    // The amount the request pays in millisatoshis.
    uint64 amount_msat = 3;

    // The expiry in seconds since the epoch, or zero for none.
    int64 expires_at = 4;

    // The 33-byte expected invoice_node_id, or empty.
    bytes expected_node_id = 5;

    // Whether a payment ever started for the request.
    bool used = 6;

    // The 32-byte payment hash of the request's current payment, or empty.
    bytes payment_hash = 7;

    // The invoices that wait for approval. They live in memory only.
    repeated PendingInvoice pending_invoices = 8;

    // The creation time in seconds since the epoch.
    int64 created_at = 9;

    // The maximum routing fee in millisatoshis for paying an invoice from
    // the expected node at once. Zero selects the default fee limit.
    int64 fee_limit_msat = 10;
}

message ListInvoiceRequestsResponse {
    repeated PublishedInvoiceRequest invoice_requests = 1;
}

message ApproveInvoiceRequestPaymentRequest {
    // The 32-byte payment hash of the pending invoice to pay.
    bytes payment_hash = 1;

    // Maximum fee in millisatoshis to pay for routing. If zero, a default
    // percentage of the payment amount is used.
    int64 fee_limit_msat = 2;
}

message ApproveInvoiceRequestPaymentResponse {
    // The 32-byte payment preimage proving settlement.
    bytes payment_preimage = 1;

    // The 32-byte payment hash.
    bytes payment_hash = 2;
}
